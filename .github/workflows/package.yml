name: Auto Releases

on:
  push:
    branches:
      - master
    paths:
      - '**/*'

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
    - name: 签出
      uses: actions/checkout@v4

    - name: 获取
      run: git fetch --prune --unshallow

    - name: 检查提交
      id: check
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ ! "$COMMIT_MSG" =~ ^v ]]; then
          exit 0
        fi
        echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT

    - name: 创建标签
      id: create_tag
      run: |
        TAG=${{ steps.check.outputs.commit_msg }}
        echo "Creating tag: $TAG"
        git tag "$TAG"
        git push origin "$TAG"

    - name: 创建压缩包
      id: create
      run: |
        TAG=${{ steps.check.outputs.commit_msg }}
        ZIP_NAME="${TAG}.zip"
        zip -r "${ZIP_NAME}" osu taiko fruits mania
        echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

    - name: 创建发版
      id: create_release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.check.outputs.commit_msg }}
        name: ${{ steps.check.outputs.commit_msg }}
        body: "自动发版"
        draft: false
        prerelease: false

    - name: 发版
      env:
        GITHUB_TOKEN: ${{ secrets.FABAN }}
      run: |
        UPLOAD_URL=$(echo "${{ steps.create_release.outputs.upload_url }}" | sed -e "s/{?name,label}//")
        FILE=${{ steps.create.outputs.zip_name }}
        curl -X POST \
             -H "Authorization: token $GITHUB_TOKEN" \
             -H "Content-Type: application/zip" \
             --data-binary @"$FILE" \
             "$UPLOAD_URL?name=$(basename $FILE)"

